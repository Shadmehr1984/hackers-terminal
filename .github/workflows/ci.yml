name: Zig CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zig-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Zig 0.13.0, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.13.0

      - name: Check formatting
        run: |
          if ! zig fmt --check test_root.zig build.zig src tests; then
            zig fmt test_root.zig build.zig src tests
            git diff -- tests/progression_test.zig
            exit 1
          fi

      - name: Compile project
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Compile and run Zig tests
        run: zig build test -Doptimize=${{ matrix.optimize }}

      - name: Check agent documentation structure
        run: sh scripts/check-agent-docs.sh
