name: Zig CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zig-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Zig 0.17.1, ${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.1

      - name: Confirm toolchain version
        run: test "$(zig version)" = "0.17.1"

      - name: Check formatting
        run: zig fmt --check test_root.zig build.zig src tests

      - name: Compile project
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Smoke-test terminal entry point
        run: printf 'exit\n' | zig build run -Doptimize=${{ matrix.optimize }} -- smoke-test

      - name: Compile and run Zig tests
        run: zig build test -Doptimize=${{ matrix.optimize }}

      - name: Check agent documentation structure
        run: sh scripts/check-agent-docs.sh
