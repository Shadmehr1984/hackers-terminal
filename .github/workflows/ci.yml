name: Zig CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: zig-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Zig 0.13.0)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Check formatting
        run: zig fmt --check test_root.zig build.zig src tests

      - name: Compile project
        run: zig build

      - name: Compile and run Zig tests
        run: zig test test_root.zig
