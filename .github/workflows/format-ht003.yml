name: Temporary HT-003 Zig Formatter

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Zig 0.13.0
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Format Zig sources
        run: zig fmt test_root.zig build.zig src tests
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "All Zig files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test_root.zig build.zig src tests
          git commit -m "Apply Zig formatting for HT-003"
          git push
