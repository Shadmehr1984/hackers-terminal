name: Zig 0.17.1 Migration Validation

on:
  push:
    branches: [main]
    paths:
      - "build.zig"
      - "src/**"
      - "tests/**"
      - "test_root.zig"
      - ".github/workflows/zig-017-build-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-017-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  io-compatibility:
    name: Zig 0.17.1 terminal and save I/O checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.1

      - name: Confirm toolchain version
        run: test "$(zig version)" = "0.17.1"

      # The full repository formatter and test suite remain deferred until
      # compatibility facades and remaining language APIs are migrated.
      - name: Check migrated-file formatting
        run: zig fmt --check build.zig src/main.zig src/application/terminal_input.zig src/application/terminal_io.zig src/application/game.zig tests/terminal_input_test.zig tests/terminal_io_test.zig tests/save_test_support.zig tests/save_io_test.zig tests/operation_test.zig save_io_test_root.zig src/shop.zig src/game.zig src/save.zig src/player.zig src/mission.zig src/contacts.zig src/commands.zig src/terminal.zig src/topology.zig src/detection.zig src/progression.zig src/mission_data.zig src/mission_state.zig src/domain/mission_modifier.zig tests/mission_modifier_test.zig tests/facade_api_test.zig facade_api_test_root.zig

      - name: Test terminal I/O compatibility layer
        run: zig test --dep terminal_io -Mroot=tests/terminal_io_test.zig -Mterminal_io=src/application/terminal_io.zig

      - name: Test filesystem and save compatibility layer
        run: zig test save_io_test_root.zig

      - name: Test Zig 0.17 type reflection compatibility
        run: zig test mission_modifier_test_root.zig

      - name: Test compatibility facade exports
        run: zig test facade_api_test_root.zig

      - name: Re-evaluate build graph
        run: zig build --help

      - name: Compile application with Zig 0.17.1
        run: zig build
