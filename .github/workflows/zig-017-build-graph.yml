name: Zig 0.17.1 Migration Validation

on:
  push:
    branches: [main]
    paths:
      - "build.zig"
      - "src/**"
      - "tests/**"
      - "test_root.zig"
      - ".github/workflows/zig-017-build-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-017-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Zig 0.17.1 (${{ matrix.optimize }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        optimize: [Debug, ReleaseSafe, ReleaseFast]
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.1

      - name: Confirm toolchain version
        run: test "$(zig version)" = "0.17.1"

      - name: Check formatting
        run: zig fmt --check test_root.zig build.zig src tests

      - name: Compile project
        run: zig build -Doptimize=${{ matrix.optimize }}

      - name: Compile and run Zig tests
        run: zig build test -Doptimize=${{ matrix.optimize }}

      - name: Smoke-test oversized input draining and command processing
        shell: bash
        run: |
          set -o pipefail
          output="$(python3 -c 'print("x" * 512); print("exit")' | zig build run -Doptimize=${{ matrix.optimize }})"
          printf '%s\n' "$output"
          grep -Fq "Input too long. Command discarded." <<< "$output"
          grep -Fq "Closing terminal. Stay safe, operator." <<< "$output"
