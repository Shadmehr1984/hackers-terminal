name: Zig 0.17.1 Migration Validation

on:
  push:
    branches: [main]
    paths:
      - "build.zig"
      - "src/**"
      - "tests/**"
      - "test_root.zig"
      - ".github/workflows/zig-017-build-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-017-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  io-compatibility:
    name: Zig 0.17.1 terminal and save I/O checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.1

      - name: Confirm toolchain version
        run: test "$(zig version)" = "0.17.1"

      # The full repository formatter/build is intentionally deferred until
      # compatibility facades and filesystem APIs are migrated in later phases.
      - name: Format migrated files and show source diffs
        run: |
          zig fmt build.zig src/main.zig src/application/terminal_input.zig src/application/terminal_io.zig src/application/game.zig src/persistence/save.zig tests/terminal_input_test.zig tests/terminal_io_test.zig tests/save_test_support.zig tests/save_io_test.zig tests/equipment_test.zig tests/operation_test.zig
          git diff -- src/persistence/save.zig tests/equipment_test.zig

      - name: Test terminal I/O compatibility layer
        run: zig test --dep terminal_io -Mroot=tests/terminal_io_test.zig -Mterminal_io=src/application/terminal_io.zig

      - name: Test filesystem and save compatibility layer
        run: zig test --dep save -Mroot=tests/save_io_test.zig -Msave=src/persistence/save.zig

      - name: Re-evaluate build graph
        run: zig build --help
