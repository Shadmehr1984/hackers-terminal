name: Zig 0.17.1 Migration Validation

on:
  push:
    branches: [main]
    paths:
      - "build.zig"
      - "src/**"
      - "tests/**"
      - "test_root.zig"
      - ".github/workflows/zig-017-build-graph.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zig-017-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  io-compatibility:
    name: Zig 0.17.1 terminal and save I/O checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install Zig 0.17.1
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with:
          version: 0.17.1

      - name: Confirm toolchain version
        run: test "$(zig version)" = "0.17.1"

      - name: Apply Zig 0.17.1 formatting and show required source changes
        run: |
          zig fmt test_root.zig build.zig src tests
          git diff --stat
          git diff -- src/persistence/save.zig src/domain/mission_state.zig src/domain/operation_state.zig src/domain/mission_objectives.zig src/domain/player.zig tests/mission_objectives_test.zig tests/equipment_test.zig
          zig fmt --check test_root.zig build.zig src tests

      - name: Test terminal I/O compatibility layer
        run: zig test --dep terminal_io -Mroot=tests/terminal_io_test.zig -Mterminal_io=src/application/terminal_io.zig

      - name: Test filesystem and save compatibility layer
        run: zig test save_io_test_root.zig

      - name: Test Zig 0.17 type reflection compatibility
        run: zig test mission_modifier_test_root.zig

      - name: Test compatibility facade exports
        run: zig test facade_api_test_root.zig

      - name: Compile application with Zig 0.17.1
        run: zig build

      - name: Compile and run the full test suite with Zig 0.17.1
        run: zig build test
