name: Temporary Zig formatter
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
      - name: Format Zig sources
        run: zig fmt test_root.zig build.zig src tests
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add test_root.zig build.zig src tests
            git commit -m "Apply Zig formatter to code review fixes"
            git push
          fi
